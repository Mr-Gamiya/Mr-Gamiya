<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Gamitha — developer portfolio</title>
  <desc id="desc">A dark navy futuristic banner with cyan and violet light, a glowing grid, and Gamitha's name.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070c1a"/><stop offset=".52" stop-color="#101a35"/><stop offset="1" stop-color="#080b1b"/></linearGradient>
    <linearGradient id="line" x2="1"><stop stop-color="#38bdf8" stop-opacity="0"/><stop offset=".48" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <linearGradient id="name" x2="1"><stop stop-color="#e8faff"/><stop offset=".5" stop-color="#6ee7f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#2563eb" stop-opacity=".32"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#5b7db1" stroke-opacity=".11"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="card"><rect x="8" y="8" width="1184" height="344" rx="23"/></clipPath>
  </defs>
  <rect x="8" y="8" width="1184" height="344" rx="23" fill="url(#bg)" stroke="#3b5c89" stroke-opacity=".65"/>
  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="958" cy="170" r="285" fill="url(#aura)"/>
    <path d="M0 75H1200M0 277H1200" stroke="url(#line)" opacity=".5"/>
    <path d="M810 35L1180 35M900 54L1180 54M830 313L1180 313" stroke="url(#line)" opacity=".45"/>
    <circle cx="965" cy="179" r="103" fill="none" stroke="#5eead4" stroke-opacity=".28"/>
    <circle cx="965" cy="179" r="140" fill="none" stroke="#a78bfa" stroke-opacity=".15" stroke-dasharray="4 10"/>
    <path d="M855 184h220M965 69v220" stroke="#73e9fb" stroke-opacity=".22"/>
    <path d="M859 110l58-40 96 15 80 74-32 105-111 30-96-82z" fill="none" stroke="#6ee7f9" stroke-opacity=".43" stroke-width="2"/>
    <path d="M859 110l58-40 96 15 80 74-32 105-111 30-96-82z" fill="none" stroke="#67e8f9" stroke-opacity=".42" stroke-width="7" filter="url(#glow)"/>
    <circle cx="1093" cy="159" r="4" fill="#6ee7f9"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="917" cy="70" r="3" fill="#c4b5fd"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="264" r="3" fill="#67e8f9"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <path d="M20 306H1180" stroke="url(#line)" stroke-width="2"><animate attributeName="opacity" values=".35;.85;.35" dur="5s" repeatCount="indefinite"/></path>
    <g fill="#6ee7f9" opacity=".75"><circle cx="630" cy="58" r="2"/><circle cx="717" cy="143" r="1.5"/><circle cx="756" cy="260" r="2"/><circle cx="117" cy="58" r="1.5"/></g>
  </g>
  <text x="70" y="92" fill="#6ee7f9" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="5">HELLO, I'M</text>
  <text x="65" y="194" fill="url(#name)" font-family="Segoe UI,Arial,sans-serif" font-size="93" font-weight="800" letter-spacing="-4">GAMITHA</text>
  <text x="70" y="238" fill="#cad9f7" font-family="Segoe UI,Arial,sans-serif" font-size="21" letter-spacing="1">DEVELOPER · WEB EXPERIENCES · PRACTICAL TOOLS</text>
  <rect x="70" y="269" width="194" height="2" fill="#6ee7f9"/>
  <text x="70" y="299" fill="#8ea8c9" font-family="Consolas,monospace" font-size="14" letter-spacing="2">github.com/Mr-Gamiya</text>
</svg>
