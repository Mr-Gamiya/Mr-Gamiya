<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">Gamitha — developer portfolio</title>
  <desc id="desc">A compact dark navy banner with cyan and violet accents for mobile screens.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d1c"/><stop offset="1" stop-color="#15264a"/></linearGradient>
    <linearGradient id="name" x2="1"><stop stop-color="#e8faff"/><stop offset=".55" stop-color="#6ee7f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#5b7db1" stroke-opacity=".12"/></pattern>
  </defs>
  <rect x="3" y="3" width="394" height="294" rx="18" fill="url(#bg)" stroke="#3b5c89"/>
  <rect x="3" y="3" width="394" height="294" rx="18" fill="url(#grid)"/>
  <path d="M25 62H375M25 245H375" stroke="#6ee7f9" stroke-opacity=".4"/>
  <circle cx="338" cy="58" r="4" fill="#a78bfa"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="365" cy="237" r="3" fill="#6ee7f9"><animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/></circle>
  <text x="25" y="48" fill="#6ee7f9" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">HELLO, I'M</text>
  <text x="22" y="143" fill="url(#name)" font-family="Segoe UI,Arial,sans-serif" font-size="51" font-weight="800" letter-spacing="-2">GAMITHA</text>
  <text x="25" y="182" fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="15">DEVELOPER · WEB EXPERIENCES</text>
  <text x="25" y="208" fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="15">PRACTICAL TOOLS</text>
  <text x="25" y="271" fill="#91a8c8" font-family="Consolas,monospace" font-size="12">github.com/Mr-Gamiya</text>
</svg>
