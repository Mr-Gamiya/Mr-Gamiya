<svg xmlns="http://www.w3.org/2000/svg" width="900" height="184" viewBox="0 0 900 184" role="img" aria-labelledby="title desc">
  <title id="title">Gamitha's animated developer workbench</title>
  <desc id="desc">A dark terminal card cycling through web experiences, automation, and practical tools.</desc>
  <defs>
    <linearGradient id="edge" x2="1"><stop stop-color="#6ee7f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#0b1228"/><stop offset="1" stop-color="#111b35"/></linearGradient>
  </defs>
  <rect x="3" y="3" width="894" height="178" rx="18" fill="url(#screen)" stroke="#385a80"/>
  <path d="M20 3H880" stroke="url(#edge)" stroke-width="3"/>
  <circle cx="34" cy="32" r="5" fill="#a78bfa"/><circle cx="54" cy="32" r="5" fill="#60a5fa"/><circle cx="74" cy="32" r="5" fill="#6ee7f9"/>
  <text x="105" y="38" fill="#91a8c8" font-family="Consolas,monospace" font-size="13">gamitha / workbench</text>
  <path d="M22 57H878" stroke="#314565"/>
  <text x="30" y="102" fill="#6ee7f9" font-family="Consolas,monospace" font-size="22" font-weight="700">&gt;</text>
  <g font-family="Consolas,monospace" font-size="20" fill="#dbeafe">
    <text x="63" y="102" opacity="1">building web experiences<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.29;.33;.66;.69;.98;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="63" y="102" opacity="0">creating practical PowerShell tools<animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.29;.33;.62;.66;.98;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="63" y="102" opacity="0">exploring ideas through code<animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.29;.33;.62;.66;.98;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <rect x="30" y="132" width="64" height="3" rx="2" fill="#6ee7f9"><animate attributeName="width" values="64;336;64" dur="12s" repeatCount="indefinite"/></rect>
  <text x="30" y="160" fill="#91a8c8" font-family="Consolas,monospace" font-size="12">STATUS  /  BUILDING IN PUBLIC</text>
  <circle cx="846" cy="149" r="5" fill="#6ee7f9"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
</svg>
