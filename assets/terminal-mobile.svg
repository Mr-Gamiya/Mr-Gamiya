<svg xmlns="http://www.w3.org/2000/svg" width="400" height="182" viewBox="0 0 400 182" role="img" aria-labelledby="title desc">
  <title id="title">Gamitha's animated developer workbench</title>
  <desc id="desc">A compact dark terminal card cycling through web experiences and practical tools.</desc>
  <defs><linearGradient id="edge" x2="1"><stop stop-color="#6ee7f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <rect x="3" y="3" width="394" height="176" rx="16" fill="#0b1228" stroke="#385a80"/>
  <path d="M20 3H380" stroke="url(#edge)" stroke-width="3"/>
  <circle cx="28" cy="29" r="4" fill="#a78bfa"/><circle cx="45" cy="29" r="4" fill="#60a5fa"/><circle cx="62" cy="29" r="4" fill="#6ee7f9"/>
  <text x="82" y="34" fill="#91a8c8" font-family="Consolas,monospace" font-size="12">gamitha / workbench</text>
  <path d="M20 52H380" stroke="#314565"/>
  <text x="22" y="92" fill="#6ee7f9" font-family="Consolas,monospace" font-size="18" font-weight="700">&gt;</text>
  <g font-family="Consolas,monospace" font-size="15" fill="#dbeafe">
    <text x="45" y="92" opacity="1">building web experiences<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.43;.5;.93;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="45" y="92" opacity="0">creating practical tools<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.43;.5;.93;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
  <rect x="22" y="123" width="45" height="3" rx="2" fill="#6ee7f9"><animate attributeName="width" values="45;220;45" dur="8s" repeatCount="indefinite"/></rect>
  <text x="22" y="155" fill="#91a8c8" font-family="Consolas,monospace" font-size="11">STATUS / BUILDING IN PUBLIC</text>
  <circle cx="365" cy="149" r="4" fill="#6ee7f9"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
</svg>
